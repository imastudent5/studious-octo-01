.nav{display:flex;gap:24px}
.nav a{
  font-size:14px;letter-spacing:.06em;color:var(--ink-2);
  padding-bottom:2px;border-bottom:1px solid transparent;
  transition:color .3s,border-color .3s;
}
.nav a:hover{color:var(--sun-deep);border-color:var(--sun)}

/* ===== Hero ===== */
.hero{
  position:relative;
  padding:clamp(92px,13vh,150px) 0 clamp(84px,10vh,120px);
}
.hero-inner{
  max-width:1080px;margin:0 auto;padding:0 28px;
}
.hero h1{
  font-family:var(--font-hand);
  font-size:clamp(56px,8.5vw,96px);
  font-weight:400;letter-spacing:.02em;line-height:1.1;
  color:var(--ink);
}
.slogan{
  margin-top:22px;
  font-family:var(--font-hand);
  font-size:clamp(21px,2.6vw,30px);letter-spacing:.03em;
  color:#8A6D2F;
}
.intro{
  margin-top:26px;font-size:16px;color:var(--ink-2);line-height:2;
  max-width:34em;
}
.tags{margin-top:30px;display:flex;gap:10px;flex-wrap:wrap}
.tags span{
  font-size:13px;letter-spacing:.06em;color:var(--ink-2);
  border:1px solid var(--sun);border-radius:999px;background:rgba(255,253,246,.66);
  padding:6px 16px;transition:border-color .3s,color .3s;
}
.tags span:nth-child(1){--t:#7FA06F}
.tags span:nth-child(2){--t:#C79A2E}
.tags span:nth-child(3){--t:#E9A13C}
.tags span:hover{border-color:var(--t);color:var(--t)}

/* 小雏菊装饰 */
.daisy{position:absolute;pointer-events:none}
.d1{width:86px;top:96px;right:7%;color:#FFFDF6;transform:rotate(16deg);opacity:.95}
.d2{width:46px;bottom:88px;left:5%;color:#F7E3A0;transform:rotate(-14deg)}
.d3{width:34px;top:46%;right:15%;color:#FFFDF6;transform:rotate(-8deg);opacity:.9}

/* ===== 模块卡片 ===== */
.modules{padding:16px 0 112px}
.modules .grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:14px;
}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:30px 22px 26px;scroll-margin-top:96px;
  transition:transform .35s cubic-bezier(.22,.61,.36,1),border-color .35s,box-shadow .35s;
}
.card:nth-child(1){--acc:#8FB4D9;--acc-shadow:rgba(143,180,217,.34);background:#F4F9FD}
.card:nth-child(2){--acc:#E9B45F;--acc-shadow:rgba(233,180,95,.34);background:#FDF6EA}
.card:nth-child(3){--acc:#7FA06F;--acc-shadow:rgba(127,160,111,.34);background:#F3F8F0}
.card:nth-child(4){--acc:#F2C94C;--acc-shadow:rgba(242,201,76,.38);background:#FEFAE6}
.card:nth-child(5){--acc:#F2A9A0;--acc-shadow:rgba(242,169,160,.34);background:#FEF3F1}
.card:hover{
  transform:translateY(-4px) rotate(-.6deg);border-color:var(--acc);
  box-shadow:0 16px 32px -20px var(--acc-shadow);
}
.card .ico{
  width:30px;height:30px;color:var(--acc);display:block;margin-bottom:14px;
  transition:transform .35s cubic-bezier(.22,.61,.36,1);
}
.card:hover .ico{transform:rotate(24deg)}
.card h3{
  font-family:var(--font-hand);
  font-size:23px;font-weight:400;letter-spacing:.05em;color:var(--ink);
  transition:color .35s;
}
.card:hover h3{color:var(--acc)}
.card p{
  margin-top:8px;font-size:13.5px;color:var(--ink-2);line-height:1.9;
}

/* ===== Footer ===== */
.footer{
  position:relative;
  background:linear-gradient(180deg,#3B5A40,#2E4430);
  color:#F2EEDC;
  padding:76px 0 48px;text-align:center;
}
.footer::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,rgba(143,180,217,.45),rgba(242,201,76,.55),rgba(127,160,111,.5),rgba(242,169,160,.45));
}
.footer .deco{position:absolute;pointer-events:none;opacity:.5}
.footer .sprig-l{left:6%;bottom:4px;width:96px;transform:rotate(18deg);color:#F5CF5C}
.footer .sprig-r{right:6%;bottom:2px;width:84px;transform:rotate(-160deg);color:#F5CF5C}
.footer .daisy-top{width:30px;height:30px;color:#F5CF5C;margin:0 auto 18px;display:block}
.footer .label{font-size:13px;letter-spacing:.3em;color:var(--footer-ink);margin-bottom:28px}
.footer .links{display:flex;justify-content:center;gap:32px;flex-wrap:wrap}
.footer .links a{
  font-size:16px;color:#F2EEDC;letter-spacing:.05em;
  border-bottom:1px solid transparent;padding-bottom:3px;
  transition:color .3s,border-color .3s;
}
.footer .links a:hover{color:#fff;border-color:#E9D9A0}
.footer .footnote{
  margin-top:38px;font-size:12.5px;color:#A9BF9B;letter-spacing:.05em;
}

/* ===== 轻提示 ===== */
.toast{
  position:fixed;left:50%;bottom:32px;z-index:99;
  transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:#FDF6E3;
  font-size:13px;letter-spacing:.05em;
  padding:11px 20px;border-radius:999px;
  opacity:0;pointer-events:none;
  transition:opacity .35s,transform .35s;
  box-shadow:0 12px 28px -14px rgba(58,50,38,.4);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 入场（单次编排，克制） ===== */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.hero-text>*{animation:rise .8s cubic-bezier(.22,.61,.36,1) both}
.hero-text>*:nth-child(1){animation-delay:.05s}
.hero-text>*:nth-child(2){animation-delay:.12s}
.hero-text>*:nth-child(3){animation-delay:.20s}
.hero-text>*:nth-child(4){animation-delay:.28s}
.d1,.d2,.d3{animation:rise .9s .3s both}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}

/* ===== 响应式 ===== */
@media (max-width:1024px){
  .modules .grid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:640px){
  .topbar-inner{padding:0 12px;height:72px}
  .brand{font-size:17px;padding:12px 0}
  .nav{gap:2px}
  .nav a{font-size:13px;letter-spacing:.03em;min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;padding:0 6px}
  .container{padding:0 18px}
  .hero-inner{padding:0 18px}
  .hero{padding-top:76px;padding-bottom:70px}
  .d1{width:60px;top:64px;right:4%}
  .d2{width:34px;bottom:64px;left:3%}
  .d3{width:26px;right:9%}
  .modules .grid{grid-template-columns:1fr;gap:12px}
  .card p{font-size:14px}
  .tags span{font-size:13.5px}
  .footer .links{gap:18px}
  .footer .links a{min-width:44px;text-align:center;padding:10px 6px}
  .footer .label{font-size:13.5px}
  .footer .footnote{font-size:12.5px}
  .footer .sprig-l,.footer .sprig-r{display:none}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" xmlns:xlink="http://www.w3.org/1999/xlink">
  <symbol id="daisy" viewBox="0 0 32 32">
    <g fill="currentColor" stroke="#E8D9A0" stroke-width="0.9">
      <ellipse cx="16" cy="8.2" rx="3.1" ry="5.4"/>
      <ellipse cx="16" cy="8.2" rx="3.1" ry="5.4" transform="rotate(45 16 16)"/>
      <ellipse cx="16" cy="8.2" rx="3.1" ry="5.4" transform="rotate(90 16 16)"/>
      <ellipse cx="16" cy="8.2" rx="3.1" ry="5.4" transform="rotate(135 16 16)"/>
      <ellipse cx="16" cy="8.2" rx="3.1" ry="5.4" transform="rotate(180 16 16)"/>
      <ellipse cx="16" cy="8.2" rx="3.1" ry="5.4" transform="rotate(225 16 16)"/>
      <ellipse cx="16" cy="8.2" rx="3.1" ry="5.4" transform="rotate(270 16 16)"/>
      <ellipse cx="16" cy="8.2" rx="3.1" ry="5.4" transform="rotate(315 16 16)"/>
    </g>
    <circle cx="16" cy="16" r="4.6" fill="#F5CF5C" stroke="#E0B64A" stroke-width="1"/>
  </symbol>
  <symbol id="sprig" viewBox="0 0 64 64">
    <path d="M32 60 C32 40 32 28 32 16" fill="none" stroke="#7FA06F" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M32 40 C24 36 20 30 20 26 C28 30 32 34 33 37" fill="#7FA06F" opacity=".85"/>
    <path d="M32 30 C40 26 44 20 44 16 C36 20 32 24 31 27" fill="#7FA06F" opacity=".85"/>
    <g transform="translate(32 14) scale(.85)"><use href="#daisy" xlink:href="#daisy"/></g>
  </symbol>
</svg>

<!-- ===== 顶栏 ===== -->
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#top">
      <svg class="daisy-mini" aria-hidden="true"><use href="#daisy" xlink:href="#daisy"/></svg>
      李一诺
    </a>
    <nav class="nav" aria-label="栏目导航">
      <a href="#reading">阅读</a>
      <a href="#movie">观影</a>
      <a href="#fitness">健身</a>
      <a href="#food">美食</a>
      <a href="#notes">琐记</a>
    </nav>
  </div>
</header>

<main id="top">

  <!-- ===== Hero ===== -->
  <section class="hero" aria-label="个人简介">
    <svg class="daisy d1" aria-hidden="true"><use href="#daisy" xlink:href="#daisy"/></svg>
    <svg class="daisy d2" aria-hidden="true"><use href="#daisy" xlink:href="#daisy"/></svg>
    <svg class="daisy d3" aria-hidden="true"><use href="#daisy" xlink:href="#daisy"/></svg>
    <div class="hero-inner">
      <div class="hero-text">
        <h1>李一诺</h1>
        <p class="slogan">Such a Badass with a goodass</p>
        <p class="intro">山东师范大学计算机与人工智能学院学生。<br>挑战自我极限的运动、生活、美食爱好者。</p>
        <div class="tags"><span>运动</span><span>生活</span><span>美食</span></div>
      </div>
    </div>
  </section>

  <!-- ===== 模块卡片 ===== -->
  <section class="modules" aria-label="栏目">
    <h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">栏目</h2>
    <div class="container">
      <div class="grid">
        <div class="card" id="reading">
          <svg class="ico" aria-hidden="true"><use href="#daisy" xlink:href="#daisy"/></svg>

        </div>
        <div class="card" id="fitness">
          <svg class="ico" aria-hidden="true"><use href="#daisy" xlink:href="#daisy"/></svg>

          <p>在极限边缘，保持热爱。</p>

        <div class="card" id="food">

</main>

<!-- ===== Footer ===== -->
<footer class="footer">
  <svg class="deco sprig-l" aria-hidden="true"><use href="#sprig" xlink:href="#sprig"/></svg>

</footer>

<div class="toast" id="toast" role="status">演示站点 · 链接待绑定真实主页</div>

<script>
  // 占位关注链接的轻提示（避免僵尸按钮）
  var toast = document.getElementById('toast');
  var timer = null;
  document.querySelectorAll('a[data-demo]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      toast.classList.add('show');
      if (timer) clearTimeout(timer);
      timer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
    });
  });
  // 版权年份
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
